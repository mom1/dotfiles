---
.common-list: &common-list
  - f_gitconfig
  - f_ssh_config
  - d_shell
  - f_zshrc
  - f_zprofile
  - f_hushlogin
  - d_antigen
  - f_antigenrc
  - f_antigen.zsh
  - d_mc
  - f_gitignore_global
  - f_editorconfig
  - f_nanorc
  - f_bash_profile
  - f_bashrc
actions:
  post:
    uv_tools_install: while read in; do uv tool install "$in"; done < dotfiles/requirements.txt
    uv_tools_upgrade: uv tool upgrade --all
    fzf_install: ~/.fzf/install
    uv_install_linux: "sh -c 'command -v uv >/dev/null 2>&1 || (curl -LsSf https://astral.sh/uv/install.sh | sh)'"
config:
  backup: true
  create: true
  dotpath: dotfiles
  link_dotfile_default: link
  link_on_import: link
dotfiles:
  d_fzf:
    src: ../fzf
    dst: ~/.fzf
    actions:
      - fzf_install
  d_antigen:
    src: ../antigen
    dst: ~/antigen
  f_antigen.zsh:
    src: ../antigen/antigen.zsh
    dst: ~/.antigen.zsh
  f_gitconfig:
    src: gitconfig
    dst: ~/.gitconfig
  f_ssh_config:
    src: ssh/config
    dst: ~/.ssh/config
  d_shell:
    src: shell
    dst: ~/.shell
  f_zshrc:
    src: zshrc
    dst: ~/.zshrc
  f_zprofile:
    src: zprofile
    dst: ~/.zprofile
  f_hushlogin:
    src: hushlogin
    dst: ~/.hushlogin
  f_antigenrc:
    src: antigenrc
    dst: ~/.antigenrc
  d_mc:
    src: config/mc
    dst: ~/.config/mc
    link: link_children
  f_gitignore_global:
    src: gitignore_global
    dst: ~/.gitignore_global
  f_editorconfig:
    src: editorconfig
    dst: ~/.editorconfig
  f_nanorc:
    src: nanorc
    dst: ~/.nanorc
  f_bash_profile:
    src: bash_profile
    dst: ~/.bash_profile
  f_bashrc:
    src: bashrc
    dst: ~/.bashrc
  f_python:
    src:
    dst:
    actions:
      - uv_tools_install
      - uv_tools_upgrade
  f_uv_install_linux:
    src:
    dst:
    actions:
      - uv_install_linux
profiles:
  mac_os:
    dotfiles:
      - f_gitconfig
      - f_ssh_config
      - d_shell
      - f_zshrc
      - f_zprofile
      - f_hushlogin
      - d_antigen
      - f_antigenrc
      - f_antigen.zsh
      - d_mc
      - f_gitignore_global
      - f_editorconfig
      - f_nanorc
      - f_bash_profile
      - f_bashrc
  linux:
    dotfiles:
      - f_gitconfig
      - f_ssh_config
      - d_shell
      - f_zshrc
      - f_zprofile
      - f_hushlogin
      - d_antigen
      - f_antigenrc
      - f_antigen.zsh
      - d_mc
      - f_gitignore_global
      - f_editorconfig
      - f_nanorc
      - f_bash_profile
      - f_bashrc
      - d_fzf
      - f_uv_install_linux
  python:
    dotfiles:
      - f_python
